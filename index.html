    <script>
      // Defensive fix for platforms/extensions trying to overwrite window.fetch in environments where it is a read-only getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchValue = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchValue;
            },
            set: function(val) {
              fetchValue = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Unable to redefine window.fetch property:", e);
        }
      })();
    </script>
